app = "tribunal-web"
primary_region = "dfw"

# Fly sends SIGINT on shutdown, waits this long, then SIGKILLs. It must cover
# adapter-node's own drain window (SHUTDOWN_TIMEOUT below): on a signal
# adapter-node stops accepting connections, waits for in-flight requests, and
# only after SHUTDOWN_TIMEOUT force-closes stragglers -- and only then emits
# `sveltekit:shutdown`, which is where the web process disposes the MCP mount,
# its OAuth connection pool, and the periodic cleanup sweep (TRI-51). Fly's
# default kill_timeout is 5s, which would SIGKILL mid-drain and skip that
# disposal entirely; 20s leaves the 15s drain plus headroom for the close
# callback, disposal, and exit to complete gracefully first.
kill_timeout = "20s"

[build]
  dockerfile = "../containers/web.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRIBUNAL_ENGINE_URL = "http://tribunal-engine.flycast"
  # adapter-node's global request-body backstop. Set to 6 MiB, deliberately
  # ABOVE the largest per-route limit rather than at or below it, so the
  # route-specific limit is always what rejects a request in normal operation and
  # this backstop only catches a route added later and never bounded individually.
  # The largest per-route limit is the GitHub webhook route's MAX_PAYLOAD_SIZE
  # (5 MiB, packages/github webhooks/types.ts), not /mcp's 1 MiB
  # (mcpRuntimeLimits.maximumRequestBodyBytes) -- both routes live under this one
  # adapter. adapter-node's inherited default is 512K, well below both, so it
  # would fail closed: dropping a legitimate 2-5 MiB webhook delivery, or a
  # tool-call body between 512 KiB and 1 MiB, before the owning route's own bound
  # ran. adapter-node parses K/M/G as 1024-based, so "6M" is 6,291,456 bytes. See
  # TRI-48.
  BODY_SIZE_LIMIT = "6M"
  # adapter-node's graceful-shutdown drain window, in seconds. On SIGINT/SIGTERM
  # it stops accepting connections and waits for in-flight requests; any still
  # running after this many seconds are force-closed, after which it emits
  # `sveltekit:shutdown` and the web process disposes the MCP mount, OAuth pool,
  # and cleanup sweep (TRI-51). Set explicitly (the adapter default is 30s) and
  # kept below kill_timeout above so the drain, disposal, and exit all finish
  # before Fly's SIGKILL. Web requests are short (long review work runs in the
  # engine, not held open here), so 15s is generous.
  SHUTDOWN_TIMEOUT = "15"

[deploy]
  # bluegreen, not rolling: with a single web Machine, "rolling" takes the
  # only Machine down before the replacement passes its health check (Fly's
  # own guidance is that rolling needs at least two Machines to avoid
  # downtime). bluegreen boots the new Machine alongside the old one and only
  # cuts traffic over once it passes checks, destroying the new Machine
  # instead of the old one on failure -- this is what keeps the previous
  # version serving through a bad boot (TRI-125).
  strategy = "bluegreen"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # >=1 so a failed boot has a previous-version Machine to fall back to
  # instead of an instant total outage (TRI-125). Trades scale-to-zero
  # savings for availability: one shared-cpu-1x/1GB Machine costs about
  # $6/month to keep warm continuously versus $0 when fully idle-stopped.
  # This also has a second-order cost beyond the Machine itself: the
  # http_service check below queries Neon Postgres every 30s once this
  # Machine never stops, which keeps Neon's own compute continuously
  # active and prevents its independent 300s idle-suspend from ever
  # completing (Fly clamps check intervals to 60s max, well under Neon's
  # 300s timeout, so no check-interval choice avoids this -- see that
  # check's own comment for why). Before this change, a fully-stopped web
  # Machine ran no health check at all, so Neon could still suspend on its
  # own between bursts of user traffic; that is no longer true.
  min_machines_running = 1
  processes = ["app"]

  # Considered splitting this into a fast dependency-free liveness check
  # plus an infrequent deep one, specifically to let Neon Postgres's 300s
  # idle-suspend timeout actually elapse between database pings. Verified
  # with `flyctl config validate` that this doesn't work: Fly clamps any
  # http_service check interval to a 60s ceiling regardless of what's
  # configured, and 60s < 300s, so ANY check hitting /health (which queries
  # the database) keeps Neon continuously active no matter the interval.
  # Dropping the database check from this one to let Neon suspend was
  # rejected too: this check also gates bluegreen promotion, so a Machine
  # that boots but cannot reach the database would be cut over to and start
  # serving live traffic before anything else could catch it -- reopening
  # the exact failure TRI-124 exists to close. Keeping the full dependency
  # check here, unconditionally active now that this Machine never fully
  # stops, is the accepted cost: see the min_machines_running comment above
  # for the full tradeoff statement.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
