pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{js,ts,svelte,json,md,css,html}'
      run: bunx lint-staged
    lint-changed:
      glob: '*.{cjs,js,jsx,mjs,svelte,ts,tsx,cts,mts}'
      # HEAD-guard: lint only changed packages when HEAD resolves,
      # otherwise (initial/orphan commit) lint all packages.
      run: |
        if git rev-parse --verify --quiet HEAD >/dev/null 2>&1; then
          bunx turbo run lint --filter='...[HEAD]' --continue -- --max-warnings 0
        else
          bunx turbo run lint --continue -- --max-warnings 0
        fi
    migration-consistency:
      glob: 'packages/database/src/schema/*'
      run: bun run packages/database/scripts/check-migration-consistency.ts
    turbo-configuration:
      # Deliberately not behind HOOKS_STRICT, unlike the CI-duplicated checks
      # in pre-push: this is a repository-wide invariant that runs in ~0.03s
      # with no network or build, and the failures it catches are invisible in
      # local output (a wrong outputs glob still prints a green cache hit).
      #
      # Covers every file the validator derives expectations from: manifests,
      # package turbo configs, and the tsconfig/svelte config that decide where
      # a build actually writes. Workspaces live at applications/* and
      # packages/*, plus runner/ and scripts/ at depth one — hence both depths.
      glob: '{turbo.json,*/turbo.json,*/*/turbo.json,package.json,*/package.json,*/*/package.json,tsconfig.json,*/tsconfig.json,*/*/tsconfig.json,*/svelte.config.js,*/*/svelte.config.js}'
      run: bun run scripts/validate-turbo-configuration.ts

    test-runner-imports:
      # Same reasoning as turbo-configuration above: a repository-wide
      # invariant, no network or build, and the failure it catches is
      # invisible locally. `bun:test` in an unlinted directory (runner/,
      # .github/, or any workspace without a `lint` script) produces a green
      # `turbo run lint` while the file quietly uses the wrong runner.
      #
      # No `glob`: the check is repo-wide by definition, and scoping it to
      # changed files would reintroduce exactly the "only where someone
      # remembered" gap it exists to close. It scans ~720 files in well under
      # a second.
      run: bun run scripts/validate-test-runner-imports.ts

pre-push:
  parallel: false
  commands:
    strict-check:
      # CI-duplicated checks remain opt-in via the HOOKS_STRICT gate.
      run: |
        if [ "${HOOKS_STRICT:-0}" = "1" ]; then
          if git rev-parse --verify @{u} >/dev/null 2>&1; then ref="@{u}"; else ref="HEAD~1"; fi
          bunx turbo run check --filter="...[$ref...HEAD]" && bunx turbo run build --filter="...[$ref...HEAD]"
        else
          echo 'Skipping CI-duplicated checks (type check, build). Use HOOKS_STRICT=1 or bun run verify for full validation.'
        fi
